# Version updates for the workflow actions: they are pinned to commit SHAs
# (tests/test-ci.sh); Dependabot bumps the SHA and the version comment.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "ci"
      include: "scope"
    groups:
      actions:
        patterns:
          - "*"
